# --- Look: dark-fantasy palette (the same as the bar and the Quickshell shell) ---

# Near-black background and muted parchment text.
background            #0b0b0c
foreground            #d7d0c5

# Slight window transparency (1.0 = fully opaque)
background_opacity    0.82

# Blur is NOT set here: kitty honors "background_blur" only on macOS -
# under Wayland it would be a dead entry. The blur under the terminal is done by Hyprland (decoration.blur
# in hyprland.lua), together with the grain.

# Allows changing the transparency on the fly: ctrl+shift+a > / < / 1
dynamic_background_opacity yes

# Cursor in old gold, selection on iron.
cursor                #b19a67
cursor_text_color     #0b0b0c
selection_background  #55504a
selection_foreground  #d7d0c5

# --- 16 terminal colors ---
# Dark-fantasy variant: instead of a garish rainbow - ember, gold, iron
# and muted green. The colors still stand apart from each other (ls, git
# diff, syntax highlighting work), but nothing screams.

# black / gray
color0  #151311
color8  #55504a
# red -> ember
color1  #8f4935
color9  #b25c43
# green -> muted moss
color2  #6f7a53
color10 #8a9668
# yellow -> old gold
color3  #b19a67
color11 #cbb480
# blue -> cold steel
color4  #5e6b73
color12 #78878f
# magenta -> patinated plum
color5  #7a5c66
color13 #97737f
# cyan -> patina
color6  #6b7d78
color14 #859a94
# white / parchment
color7  #d7d0c5
color15 #efe8dc

# Border color of the active and inactive kitty window (when split into panes)
active_border_color   #b19a67
inactive_border_color #55504a

# Inactive windows slightly dimmed
inactive_text_alpha   0.85

# --- Scrolling ---

# How many lines one touchpad "step" scrolls. Default is 1.0, which on Wayland
# gives very slow scrolling. This option applies only to high-precision
# devices (touchpad), not the mouse wheel.
# A negative value reverses the direction.
touch_scroll_multiplier 4.0

# Regular mouse wheel - default is 5.0. Left unchanged so that speeding up the
# touchpad does not get out of step with an external mouse.
wheel_scroll_multiplier 5.0
