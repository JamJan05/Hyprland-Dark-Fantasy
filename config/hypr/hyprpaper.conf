# Configuration of hyprpaper - Hyprland's wallpaper daemon.
#
# WARNING: hyprpaper 0.8 changed the syntax. Older guides on the internet give
# "preload = ..." and "wallpaper = ,..." - those keys no longer exist and such a file
# loads without an error, only the wallpaper never appears. Now there is a
# "wallpaper { ... }" block, and this is what a correct entry looks like:

# Splash text at the bottom of the screen ("Read the wiki.", "Hyprland is not a DE" and
# friends). It is HYPRPAPER that draws it: Hyprland only picks the random string, and
# hyprpaper fetches it and paints it over the wallpaper. Hence none of Hyprland's own
# options remove it - disable_splash_rendering, disable_hyprland_logo,
# force_default_wallpaper and a transparent misc:col.splash were all tried and all
# failed, see the note in hyprland.lua.
#
# A top-level key, OUTSIDE the block below - this is how hyprpaper registers it
# (src/config/ConfigManager.cpp, default 1 = on). "hyprctl reload" is not enough,
# hyprpaper has to start again: log out and back in, or restart the process.
splash = 0

wallpaper {
    # Empty value = every monitor. After connecting a second screen nothing
    # needs to be added. For a specific screen: monitor = eDP-1
    monitor =

    # Default: the wallpaper shipped with the repository (assets/wallpaper.png,
    # copied there by install.sh). Pick another one in the Cogwheel
    # (Hyprland -> Wallpaper), which rewrites this line.
    path = ~/.local/share/dark-fantasy/wallpaper.png

    # How to fit the image to the screen:
    #   cover   - scales up to fill the screen, crops the excess (default)
    #   contain - fits the whole image, adds black bars
    #   fill    - stretches to the screen size, distorts proportions
    #   tile    - repeats the image like tiles
    # E.g. a 1920x1200 (16:10) screen with a 1920x1080 (16:9) wallpaper: with "cover"
    # about 106 px is cut off on the left and right. The centre of the frame stays untouched.
    fit_mode = cover
}

# Slideshow: instead of "path" point to a directory and add to the block
#   timeout = 600        (change every 10 minutes)
#   order = random       (or default / random-shuffle)
#   recursive = true     (descend into subdirectories)
