# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# LOCK SCREEN (hyprlock 0.9.6)
#
# This file uses hyprlang syntax (key = value, brace
# blocks) - hyprlock does NOT read Lua. That applies only to
# the compositor itself, whose config lives in hyprland.lua.
#
# Invoked by: SUPER+L, or automatically from hypridle after
# 10 minutes of idle.
#
# DO NOT KILL HYPRLOCK WITH PKILL WHILE THE LOCK IS ACTIVE.
#
# hyprlock is an ext-session-lock protocol client. Killing it with a signal
# while the lock is active leaves the compositor in a "locked without
# a client" state and can bring down the whole Hyprland session. This really
# happened on this machine during testing. That it is a known scenario shows
# in Hyprland's API having a dedicated rescue function:
#     hyprctl dispatch 'hl.clear_crashed_lockscreen()'
#
# Normal exit: just type the password.
#
# A safe way to look at the design without risking typing the password:
#     hyprlock --grace 30
# for 30 seconds any mouse movement unlocks the screen without a password,
# and hyprlock exits by itself, cleanly.
#
# Emergency exit, if hyprlock really gets stuck: switch
# to another console (Ctrl+Alt+F2), log in and only from there:
#     pkill hyprlock
# and if the screen stays locked without a client, after coming back:
#     hyprctl dispatch 'hl.clear_crashed_lockscreen()'
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

# Two typefaces, as in the whole theme:
#   $font        - numbers: clock, password (dots), keyboard layout
#   $font_napisy - lettering: date, user, motto (EB Garamond in small caps)
#
# Small caps are the "EB Garamond SC" FAMILY, not the pango
# font_variant="small-caps" markup. For small-caps Pango enables the "smcp"
# feature, and in EB Garamond 0.016 that feature has no "ł" glyph - the motto came out
# as "Popió  pamięta, p omień czeka", and the password field as "Wpisz has o". The SC family
# from the same package has a small-caps "ł" drawn directly.
#
# font_features="lnum" on the date: lining figures. Garamond draws
# old-style figures by default, and "11" then looks like Roman "II".
$font = JetBrainsMono Nerd Font
$font_napisy = EB Garamond SC

# ===== THE WALLPAPER LINE (THE COGWHEEL REWRITES IT) =====
#
# Lock screen wallpaper.
#
# The tilde works - hyprlock passes the background path through absolutePath()
# (src/renderer/widgets/Background.cpp), and that function explicitly replaces
# a leading "~" with the contents of the HOME variable (src/helpers/MiscFunctions.cpp).
# This keeps the config portable between accounts.
#
# Instead of an image you can enter the word "screenshot" - hyprlock then blurs
# the current screen contents. Note: window contents then remain visible,
# though blurred.
#
# Default: the wallpaper shipped with the repository (assets/wallpaper.png,
# linked there by install.sh). Pick another one in the Cogwheel
# (Hyprland -> Wallpaper), which rewrites this line.
$tapeta = ~/.local/share/dark-fantasy/wallpaper.png

# Dark-fantasy palette - the same values as in the bar's CSS.
$tlo        = rgba(0b0b0cff)
$tekst      = rgba(d7d0c5ff)
$przygaszony = rgba(81786bff)
$zloto      = rgba(b19a67ff)
$zar        = rgba(8f4935ff)
$zelazo     = rgba(55504aff)

# Interface language (Cogwheel -> Language). English defaults first, then
# the file the shell writes in the active language, which overrides them.
# hyprlang substitutes a variable when it reads the line that uses it, so
# the source MUST stay above the widgets. A missing file (the shell has
# never run) is only logged by hyprlock - the English defaults stay.
$df_haslo = Enter password
$df_sprawdzam = Checking…
$df_motto = Ash remembers, the flame waits
source = ~/.local/state/dark-fantasy/hyprlock-jezyk.conf

general {
    hide_cursor = true

    # The lock does not disappear when the monitor wakes up - without this,
    # with "dpms off" from hypridle, the screen can come back unlocked.
    ignore_empty_input = false
}

animations {
    enabled = true
    bezier = wolno, 0.25, 1, 0.5, 1
    animation = fadeIn,  1, 6, wolno
    animation = fadeOut, 1, 6, wolno
    animation = inputFieldDots, 1, 3, wolno
}

# ----- BACKGROUND -----
# The same wallpaper as on the desktop, heavily blurred and darkened.
# If you prefer a blurred screenshot of the current screen, enter: path = screenshot
# WARNING: with "screenshot" the lock screen still shows the window contents
# from before locking - blurred, but still.
background {
    monitor =
    path = $tapeta

    blur_passes = 3
    blur_size = 8
    # "Ash, not smooth black" - stronger than under the bar (0.03 in
    # hyprland.lua), because the lock background is heavily darkened and fine
    # noise would get lost on it.
    noise = 0.04
    contrast = 0.9
    brightness = 0.35      # strong darkening - text must be readable
    vibrancy = 0.15
    vibrancy_darkness = 0.2
}

# ----- CLOCK -----
label {
    monitor =
    text = $TIME
    color = $tekst
    font_size = 112
    font_family = $font

    position = 0, 120
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 6
    shadow_color = rgba(0b0b0ccc)
}

# ----- DATE -----
# cmd[update:60000] makes hyprlock run the command every 60 seconds.
# The locale follows df-jezyk: pl_PL.UTF-8 for "pl", otherwise C.UTF-8, so
# %A and %B give day and month names in the interface language.
label {
    monitor =
    # %-d instead of %d: "11 September", but "1 September", not "01 September".
    text = cmd[update:60000] echo "<span font_features='lnum' letter_spacing='1536'>$(LC_ALL=$([ "$(df-jezyk 2>/dev/null)" = pl ] && echo pl_PL.UTF-8 || echo C.UTF-8) date +'%A, %-d %B %Y')</span>"
    color = $przygaszony
    font_size = 22
    font_family = $font_napisy

    position = 0, 20
    halign = center
    valign = center
}

# ----- PASSWORD FIELD -----
input-field {
    monitor =
    size = 320, 48
    # 1 px and sharp corners - like every frame in the theme.
    outline_thickness = 1
    rounding = 0

    # Almost black, slightly transparent fill.
    inner_color = rgba(15131188)

    # Border: calm iron, gold while checking,
    # ember on a wrong password.
    outer_color = $zelazo
    check_color = $zloto
    fail_color  = $zar

    font_color = $tekst
    font_family = $font

    # Dots instead of password characters.
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true

    fade_on_empty = false

    placeholder_text = <span font_family="EB Garamond SC" letter_spacing="1536">$df_haslo</span>
    fail_text = <span font_family="EB Garamond SC">$PAMFAIL</span>
    check_text = <span font_family="EB Garamond SC">$df_sprawdzam</span>

    position = 0, -70
    halign = center
    valign = center
}

# ----- USER NAME -----
label {
    monitor =
    text = <span letter_spacing="1536">$USER</span>
    color = $przygaszony
    font_size = 15
    font_family = $font_napisy

    position = 0, -130
    halign = center
    valign = center
}

# ----- LETTERING AT THE BOTTOM EDGE -----
#
# Original text, not a quote from Dark Souls 3: the theme copies neither
# graphics nor texts from the game. The login screen carries the same lettering (sddm/dark-fantasy/theme.conf).
#
# "Visible, but not shouting" is achieved with color, not size:
# the muted color #81786b with alpha aa (67%) plus italics.
# Shrinking the font would make the lettering unreadable, not discreet.
#
# letter_spacing is a pango markup attribute (1024 = 1 typographic point).
# Spaced-out letters read like an inscription, not like an ordinary caption,
# and allow lower brightness without losing readability.
#
# The shadow is here so the lettering does not vanish on brighter parts of
# the wallpaper - without it, at such low contrast, it would sometimes be unreadable.
label {
    monitor =
    text = <span letter_spacing="2048">$df_motto</span>
    color = rgba(81786baa)
    font_size = 17
    font_family = $font_napisy

    position = 0, 64
    halign = center
    valign = bottom

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0b0b0cbb)
}

# ----- KEYBOARD LAYOUT -----
# Useful if a second layout is ever added next to "pl".
# Clicking switches the layout.
label {
    monitor =
    text = $LAYOUT
    color = $zelazo
    font_size = 12
    font_family = $font
    onclick = hyprctl switchxkblayout all next

    position = 0, 30
    halign = center
    valign = bottom
}
