# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --
# IDLE (hypridle 0.1.8)
#
# hyprlang syntax, not Lua - same as hyprlock.conf.
#
# Schedule:
#    5 min  -> monitor off (dpms off)
#   10 min  -> lock screen (hyprlock)
#   30 min  -> computer suspend
# -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- -- --

general {
    # df-blokada guards against launching a SECOND lock
    # instance. Without it, waking up and crossing the threshold again stacks
    # another hyprlock on top of the previous one, and each must be unlocked separately.
    # It looks only at this session's hyprlock - "pidof hyprlock" also saw
    # a lock in another session and then did not lock this one. A tilde, not
    # $HOME: hyprlang would read $HOME as one of its own variables.
    lock_cmd = ~/.local/bin/df-blokada

    # Lock BEFORE suspend. loginctl lock-session sends a signal that
    # hypridle catches and runs lock_cmd above - so the
    # double-instance guard still works.
    before_sleep_cmd = loginctl lock-session

    # After waking up the monitor is sometimes still blanked and you have to
    # move the mouse to see anything. This line turns it on right away.
    #
    # WARNING: Lua syntax. Hyprland reads its config from hyprland.lua,
    # so "hyprctl dispatch dpms on" would return a syntax error and the screen
    # would stay black. The example file shipped with the package does
    # the same (/usr/share/hypr/hypridle.conf).
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'

    # Do not blank or suspend while video is playing or a call is
    # in progress - programs report this through the idle-inhibit protocol.
    # The Cogwheel's screen-blanking inhibit toggle does the same by hand.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# ----- 5 MIN: MONITOR OFF -----
listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# ----- 10 MIN: LOCK SCREEN -----
# loginctl lock-session instead of calling hyprlock directly - it goes
# through general.lock_cmd, so it benefits from the df-blokada guard.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# ----- 30 MIN: SUSPEND -----
# The system runs OpenRC + elogind, so there is NO systemctl here.
# Suspend is handled by loginctl from the sys-auth/elogind package - the same
# command is used by the Bonfire tile (services/Sesja.qml).
listener {
    timeout = 1800
    on-timeout = loginctl suspend
}

# ----- OPTIONAL: DIMMING THE SCREEN BEFORE BLANKING -----
# A gentle warning 30 seconds before the monitor turns off: the backlight
# drops to 10%, and moving the mouse restores the previous brightness.
# Uncomment if you want it. brightnessctl is already installed.
#
# listener {
#     timeout = 270
#     on-timeout = brightnessctl -s set 10%
#     on-resume  = brightnessctl -r
# }
